[package]
name = "keel"
version = "0.1.0"
edition = "2024"
description = "借鉴 IntelliJ IDEA 交互范式的 Rust 原生 IDE"

# 根目录即 GPUI 主线工作区；nsh 版本归档在 legacy/nsh/。
[workspace]

[dependencies]
# 主题令牌与工作区模型抽成独立 crate。
keel-theme = { path = "crates/keel-theme" }
# gpui-ce 0.3.0 对应 GitHub 提交 58ff79777198b35e78467795eb50eb258d640eb9。
# 组件仓库 main 仍按 crates.io 引用 gpui-ce =0.3.0，保持同一来源可避免重复 gpui 类型。
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0" }
# 组件源码固定为 GitHub main@d248729826757c96133ab723da3fee1cd2ed0ad6。
gpui_component = { package = "gpui_ce_components", git = "https://github.com/gpui-ce/gpui-component", rev = "d248729826757c96133ab723da3fee1cd2ed0ad6", features = ["tree-sitter-java"] }
gpui_component_assets = { package = "gpui_ce_components_assets", git = "https://github.com/gpui-ce/gpui-component", rev = "d248729826757c96133ab723da3fee1cd2ed0ad6" }
rfd = "0.15"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
